name: Bug report
description: Report a reproducible problem with OpenBIMI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenBIMI. Remove credentials, private data, and unrelated DNS records before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result you observed and what you expected instead.
      placeholder: OpenBIMI showed… I expected…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Enter…
        3. Select…
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL
      placeholder: https://openbimi.com/…
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 132 on macOS 15
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots, logs, or DNS details that help explain the problem.
